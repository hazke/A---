# A股量化交易系统配置文件

# 数据源配置
data_source:
  default: baostock  # baostock, akshare, tushare
  tushare:
    token: ""  # 需要填写tushare token
  akshare:
    timeout: 30
  baostock:
    # BaoStock无需配置，直接使用

# 交易配置
trading:
  initial_capital: 1000000  # 初始资金（元）
  commission_rate: 0.0003   # 手续费率
  slippage: 0.001           # 滑点
  min_trade_amount: 100    # 最小交易金额

# 风险控制
risk_control:
  max_position: 0.3         # 单只股票最大仓位
  max_total_position: 0.95  # 总仓位上限
  stop_loss: 0.05          # 止损比例
  take_profit: 0.20        # 止盈比例

# 日志配置
logging:
  level: INFO
  file: logs/trading.log

# AgenticQ 数据感知层 (Stage 01)
agenticq:
  default_symbol: "601138"
  perception:
    freshness_sla_seconds: 120
    sectors:
      - code: "BK0447"
        name: "通信设备"
      - code: "BK0448"
        name: "计算机设备"
      - code: "BK1036"
        name: "半导体"
      - code: "BK0800"
        name: "人工智能"
    etfs:
      - code: "588000"
        name: "科创50ETF"
      - code: "515050"
        name: "5G通信ETF"
      - code: "512760"
        name: "芯片ETF"
    global_tickers:
      - symbol: "NVDA"
        name: "英伟达"
      - symbol: "SOXX"
        name: "半导体ETF"
      - symbol: "QQQ"
        name: "纳指100ETF"

